name: ci

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install the tools the suites use
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux python3 util-linux
          tmux -V
          python3 --version

      # One annotation carrying the failing tail. Individual ::error:: lines are
      # capped before the useful detail is reached, so the whole tail is folded
      # into a single message: annotations are public, logs are not.
      - name: Run every suite
        run: |
          set +e
          just test > /tmp/suite.log 2>&1
          rc=$?
          tail -60 /tmp/suite.log
          if [ "$rc" -ne 0 ]; then
            folded=$(tail -60 /tmp/suite.log | tr '\n' '|' | cut -c1-65000)
            printf '::error::%s\n' "$folded"
            exit "$rc"
          fi
