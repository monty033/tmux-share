name: ci

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install the tools the suites use
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux python3 util-linux
          tmux -V
          python3 --version

      # The suite output is re-emitted as workflow annotations on failure.
      # Annotations are readable by anyone through the public API, so a failing
      # run can be diagnosed without downloading logs, which need a token.
      - name: Run every suite
        run: |
          set +e
          just test > /tmp/suite.log 2>&1
          rc=$?
          tail -40 /tmp/suite.log
          if [ "$rc" -ne 0 ]; then
            grep -E '^(FAIL|failed:|  *FAIL)|Error:|error:' /tmp/suite.log | head -20 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            exit "$rc"
          fi
