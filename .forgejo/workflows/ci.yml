name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: nixos
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          export PATH="/run/current-system/sw/bin:$PATH"
          tmux -V
          python3 --version
          just --version
          just test
