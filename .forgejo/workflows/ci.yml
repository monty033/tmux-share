name: ci

"on":
  push:
  pull_request:

jobs:
  test:
    # This host's runner advertises "ubuntu-latest:docker://node:18-bullseye" and
    # "nixos:host". The host label is used because the tools the suites need
    # (tmux, python3, flock, just) are already in /run/current-system/sw/bin
    # there, so the job installs nothing: every install step that can fail on a
    # container's network is a way for CI to fail for reasons unrelated to the
    # change under test.
    runs-on: nixos
    steps:
      - uses: actions/checkout@v4

      - name: Report the tool versions in use
        run: |
          export PATH="/run/current-system/sw/bin:$PATH"
          tmux -V
          python3 --version
          just --version

      - name: Run every suite
        run: |
          export PATH="/run/current-system/sw/bin:$PATH"
          just test
